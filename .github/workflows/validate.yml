name: Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Re-run daily so we catch any changes to HACS/hassfest requirements
    - cron: "0 4 * * *"

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hassfest Action
        uses: home-assistant/actions/hassfest@master

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black pylint

      - name: Check code formatting with Black
        run: black --check custom_components/warema_wms

      - name: Validate JSON files
        run: |
          python -m json.tool custom_components/warema_wms/manifest.json > /dev/null
          python -m json.tool custom_components/warema_wms/strings.json > /dev/null

      - name: Lint Python code
        run: |
          pylint custom_components/warema_wms \
            --disable=all \
            --enable=E,F \
            --exit-zero
