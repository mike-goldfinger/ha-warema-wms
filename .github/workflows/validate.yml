name: Validate Home Assistant Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black pylint

    - name: Check code formatting with Black
      run: black --check custom_components/warema_wms

    - name: Validate manifest.json
      run: |
        python -m json.tool custom_components/warema_wms/manifest.json > /dev/null

    - name: Validate strings.json
      run: |
        python -m json.tool custom_components/warema_wms/strings.json > /dev/null

    - name: Lint Python code
      run: |
        pylint custom_components/warema_wms \
          --disable=all \
          --enable=E,F \
          --exit-zero
      continue-on-error: true
